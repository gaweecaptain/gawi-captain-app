<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>가위캡틴 영업관리</title>

<style>

body { font-family: Arial; padding:20px; }

input, button { margin:5px; padding:10px; }

table { border-collapse: collapse; width:100%; margin-top:20px;}

td, th { border:1px solid #ddd; padding:8px;}

</style>

</head>

<body>

<h2>가위캡틴 영업관리</h2>

<input id="name" placeholder="고객명">

<input id="product" placeholder="제품명">

<input id="amount" type="number" placeholder="금액">

<button onclick="addData()">추가</button>

<table>

<thead>

<tr><th>고객명</th><th>제품</th><th>금액</th><th>삭제</th></tr>

</thead>

<tbody id="list"></tbody>

</table>

<script>

let data = JSON.parse(localStorage.getItem("sales")||"[]");

function save(){

  localStorage.setItem("sales", JSON.stringify(data));

  render();

}

function addData(){

  const name=document.getElementById("name").value;

  const product=document.getElementById("product").value;

  const amount=document.getElementById("amount").value;

  if(!name || !product || !amount) return;

  data.push({name, product, amount});

  save();

}

function del(i){

  data.splice(i,1);

  save();

}

function render(){

  const list=document.getElementById("list");

  list.innerHTML="";

  data.forEach((d,i)=>{

    list.innerHTML+=`

    <tr>

      <td>${d.name}</td>

      <td>${d.product}</td>

      <td>${d.amount}</td>

      <td><button onclick="del(${i})">삭제</button></td>

    </tr>`;

  });

}

render();

</script>

</body>

</html>
